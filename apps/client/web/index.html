<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Track calories together with your partner">
  <meta name="theme-color" content="#10B981">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Eato">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eato</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Clerk.js SDK for web authentication -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="__CLERK_PUBLISHABLE_KEY__"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    onload="window.clerkLoaded = true; window.dispatchEvent(new Event('clerk-loaded'));">
  </script>
  <script src="clerk_init.js"></script>
  <script src="web_push_helper.js"></script>

  <!-- Firebase configuration (generated by scripts/generate-firebase-config.sh) -->
  <script src="firebase-config.js"></script>

  <!-- Firebase SDK for web push notifications -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <script>
    // Initialize Firebase
    if (typeof firebaseConfig !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      console.log('[eato] Firebase initialized');

      // Register service worker for background messages
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('[eato] Firebase SW registered:', registration.scope);
          })
          .catch((error) => {
            console.error('[eato] Firebase SW registration failed:', error);
          });
      }
    } else {
      console.warn('[eato] Firebase config not found. Run scripts/generate-firebase-config.sh');
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
