name: Eato
options:
  bundleIdPrefix: com.eato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your real Apple Developer Team ID via ios/Config/Local.xcconfig or CI.
    DEVELOPMENT_TEAM: ""

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "0.40.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: "1.0.0"
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    from: "1.0.0"

targets:
  Eato:
    type: application
    platform: iOS
    sources:
      - path: Eato
        excludes:
          - "App/Info.plist"
          - "App/Eato.entitlements"
    resources:
      - path: Eato/Resources
    dependencies:
      - package: Clerk
        product: Clerk
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: HTTPTypes
        product: HTTPTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eato.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Eato/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Eato/App/Eato.entitlements
        GENERATE_INFOPLIST_FILE: NO

  EatoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EatoTests
    dependencies:
      - target: Eato
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eato.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Eato:
    build:
      targets:
        Eato: all
        EatoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EatoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
